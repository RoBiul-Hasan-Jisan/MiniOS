# MiniOS Boot Configuration

[boot]
timeout = 5
default = minios
splash = true

[os:minios]
name = MiniOS Python Simulation
kernel = /boot/kernel
initrd = /boot/initrd
root = /dev/root
options = quiet splash

[os:recovery]
name = MiniOS Recovery Mode
kernel = /boot/kernel
initrd = /boot/initrd
root = /dev/root
options = single

[hardware]
vga_mode = text
keyboard_layout = us
serial_enable = true